name: Regenerate lockfile (temporary)

on:
  pull_request:
    branches: [master]

jobs:
  regenerate:
    name: Regenerate package-lock.json on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Regenerate lockfile
        run: rm -f package-lock.json && npm install --package-lock-only
      - name: Verify npm ci works with the regenerated lockfile
        run: npm ci
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
