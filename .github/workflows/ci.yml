name: CI

on:
  pull_request:
    branches: [master]

jobs:
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        # Runs the MIT-licensed gitleaks CLI directly rather than the
        # gitleaks-action wrapper, which requires a paid license key for
        # organization-owned repos (this repo is owned by the ZephyRoute
        # org) since the wrapper's own license changed at v2.0.0. Scans
        # full commit history via `git log -p`, exits 1 (failing the job)
        # if any secret is found.
        run: docker run -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:latest git /repo

  quality:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        # package-lock.json used to be missing top-level entries for a
        # few packages several levels deep in an unused optional
        # connector chain (wagmi -> @base-org/account -> @coinbase/
        # cdp-sdk -> @solana/kit, zod, bufferutil, @emnapi/*), which
        # made `npm ci` fail here since this repo's very first PRs.
        # Regenerating the lockfile from Windows never closed the gap
        # (tried a full fresh regeneration and forcing linux/x64
        # resolution, neither worked); regenerated instead on a real
        # Linux runner (a throwaway workflow run, `rm -f package-
        # lock.json && npm install --package-lock-only`, self-verified
        # with `npm ci` in that same run before being applied here),
        # closing the gap for real. Back to `npm ci` now that the
        # lockfile is actually complete.
        run: npm ci
      - name: Generate Next.js route types
        # `tsc --noEmit` below needs `.next/types` to exist first, it's
        # where Next.js's own generated ambient types (RouteContext for
        # dynamic API routes, etc.) live; without this the typecheck
        # step fails on every dynamic route with "Cannot find name
        # 'RouteContext'", the same stale/missing-types failure hit
        # repeatedly this session locally after checking out a branch
        # with a different set of routes, worked around there with
        # `rm -rf .next && npx next typegen`. CI starts with no `.next`
        # at all, so it needs the generation step unconditionally, not
        # just the cache-clear half of that workaround.
        run: npx next typegen
      - name: ESLint (includes ARIA/accessibility rules)
        run: npm run lint
      - name: Stylelint (design-token discipline)
        run: npm run lint:css
      - name: TypeScript strict-mode compile check
        run: npx tsc --noEmit
      - name: Test suite (includes WCAG contrast and axe accessibility checks)
        run: npm run test
      - name: Production build
        run: npm run build
